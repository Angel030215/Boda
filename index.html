<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ángel & Heidi | Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#ece5d8;
    font-family:'Montserrat',sans-serif;
    color:#3f4a3f;
    padding:40px 15px;
}

.contenedor{
    max-width:850px;
    margin:auto;
}

.invitacion{
    background:#ffffff;
    padding:70px 50px;
    border-radius:10px;
    box-shadow:0 15px 35px rgba(0,0,0,.18);
    position:relative;
    overflow:hidden;
}

/* FLORALES */

.floral{
    position:absolute;
    pointer-events:none;
    z-index:0;
}

.floral svg{
    width:100%;
    height:auto;
}

.floral-top-left{
    width:420px;
    top:-90px;
    left:-90px;
    opacity:.55;
}

.floral-bottom-right{
    width:500px;
    right:-130px;
    bottom:-130px;
    opacity:.60;
    transform:rotate(180deg);
}

.encabezado,
.seccion,
.linea,
.mensaje{
    position:relative;
    z-index:2;
}

.encabezado{
    text-align:center;
}

.noscasamos{
    letter-spacing:4px;
    font-size:14px;
    margin-bottom:20px;
    color:#76816f;
}

.nombres{
    font-family:'Pinyon Script',cursive;
    font-size:100px;
    line-height:1;
    color:#3f4a3f;
    margin-bottom:8px;
}

.anillos{
    margin:8px 0 20px;
}

.fecha{
    font-family:'Cormorant Garamond',serif;
    font-size:36px;
    color:#4e5b4b;
}

.descripcion{
    max-width:620px;
    margin:20px auto 0;
    line-height:1.9;
}

.linea{
    width:70%;
    height:1px;
    background:#d9d9d9;
    margin:40px auto;
}

.seccion{
    text-align:center;
    margin-top:10px;
}

.titulo{
    font-family:'Cormorant Garamond',serif;
    font-size:46px;
    color:#485446;
    margin-bottom:20px;
}

.hora{
    font-size:34px;
    color:#5b6958;
    margin-bottom:25px;
}

.boton{
    display:inline-block;
    padding:14px 32px;
    background:#76856e;
    color:#fff;
    text-decoration:none;
    border-radius:4px;
    font-weight:600;
    transition:.3s;
}

.boton:hover{
    background:#677562;
}

.contador{
    display:flex;
    justify-content:center;
    gap:35px;
    flex-wrap:wrap;
    margin-top:20px;
}

.item{
    min-width:80px;
}

.numero{
    font-family:'Cormorant Garamond',serif;
    font-size:52px;
    color:#485446;
}

.label{
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.mensaje{
    margin-top:60px;
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-size:30px;
    font-style:italic;
    color:#5c6458;
}

@media(max-width:768px){

    .invitacion{
        padding:50px 25px;
    }

    .nombres{
        font-size:72px;
    }

    .fecha{
        font-size:28px;
    }

    .titulo{
        font-size:36px;
    }

    .numero{
        font-size:38px;
    }

    .floral-top-left{
        width:270px;
        top:-60px;
        left:-60px;
    }

    .floral-bottom-right{
        width:320px;
        right:-80px;
        bottom:-80px;
    }
}

</style>
</head>

<script>

const fechaBoda = new Date("2026-12-05T14:00:00");

function actualizarContador(){

const ahora = new Date();
const diferencia = fechaBoda - ahora;

const dias = Math.floor(diferencia/(1000*60*60*24));
const horas = Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));
const minutos = Math.floor((diferencia%(1000*60*60))/(1000*60));
const segundos = Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").textContent = Math.max(0,dias);
document.getElementById("horas").textContent = Math.max(0,horas);
document.getElementById("minutos").textContent = Math.max(0,minutos);
document.getElementById("segundos").textContent = Math.max(0,segundos);

}

actualizarContador();
setInterval(actualizarContador,1000);

</script>
