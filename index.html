<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ángel & Heidi | Nuestra Boda</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Segoe UI, sans-serif;
background:#f5f5ef;
color:#34403a;
text-align:center;
}

.hero{
min-height:75vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px 20px;
}

.hero h3{
letter-spacing:4px;
font-weight:400;
color:#66755f;
margin-bottom:15px;
}

.hero h1{
font-size:5rem;
font-weight:300;
margin-bottom:20px;
}

.fecha{
font-size:2rem;
margin-bottom:30px;
}

.descripcion{
max-width:800px;
font-size:1.2rem;
line-height:1.8;
}

section{
padding:80px 20px;
}

h2{
font-size:3rem;
font-weight:300;
margin-bottom:40px;
}

.contador{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:60px;
}

.item{
min-width:120px;
}

.numero{
font-size:4rem;
font-weight:bold;
}

.texto{
font-size:1.2rem;
margin-top:10px;
}

.card{
background:white;
max-width:500px;
margin:auto;
padding:40px;
border-radius:15px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.card p{
font-size:1.2rem;
margin-bottom:25px;
}

.boton{
display:inline-block;
padding:15px 30px;
background:#66755f;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:600;
}

.boton:hover{
background:#55634f;
}

footer{
padding:100px 20px;
font-size:2rem;
font-style:italic;
}

@media(max-width:768px){

.hero h1{
font-size:3rem;
}

h2{
font-size:2.2rem;
}

.contador{
gap:30px;
}

.numero{
font-size:3rem;
}

}

</style>
</head>

<body>

<section class="hero">

<h3>NOS CASAMOS</h3>

<h1>Ángel & Heidi</h1>

<div class="fecha">
5 de diciembre de 2026
</div>

<div class="descripcion">
Con mucha alegría queremos compartir con ustedes uno de los momentos más importantes de nuestra vida.
</div>

</section>

<section>

<h2>Cuenta regresiva</h2>

<div class="contador">

<div class="item">
<div id="dias" class="numero">0</div>
<div class="texto">Días</div>
</div>

<div class="item">
<div id="horas" class="numero">0</div>
<div class="texto">Horas</div>
</div>

<div class="item">
<div id="minutos" class="numero">0</div>
<div class="texto">Minutos</div>
</div>

<div class="item">
<div id="segundos" class="numero">0</div>
<div class="texto">Segundos</div>
</div>

</div>

</section>

<section>

<h2>Ceremonia</h2>

<div class="card">

<p>2:00 PM</p>

<a
class="boton"
href="https://maps.app.goo.gl/Vz62zKy95kfWyWmp6"
target="_blank">
Ver ubicación
</a>

</div>

</section>

<footer>
El mejor regalo será compartir este día contigo.
</footer>

<script>

const fechaBoda = new Date("2026-12-05T14:00:00");

function actualizarContador(){

const ahora = new Date();
const diferencia = fechaBoda - ahora;

const dias = Math.floor(diferencia/(1000*60*60*24));
const horas = Math.floor((diferencia%(1000*60*60*24))/(1000*60*60));
const minutos = Math.floor((diferencia%(1000*60*60))/(1000*60));
const segundos = Math.floor((diferencia%(1000*60))/1000);

document.getElementById("dias").innerHTML = dias;
document.getElementById("horas").innerHTML = horas;
document.getElementById("minutos").innerHTML = minutos;
document.getElementById("segundos").innerHTML = segundos;

}

actualizarContador();
setInterval(actualizarContador,1000);

</script>

</body>
</html>
